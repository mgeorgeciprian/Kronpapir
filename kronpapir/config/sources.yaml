      content: "div.post-content, div.entry-content, article.content"
      date: "span.date, time.publish-date, span.posted-on"
      image: "img.featured, img.thumb, div.featured-image img"
      article_link: "a.post-link, h2.post-title a, article a.title"
    homepage: "https://newsbv.ro"
