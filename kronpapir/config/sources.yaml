# Kronpapir.ro News Sources Configuration
# Local news sources for Brașov/Covasna region

sources:
  # LOCAL SOURCES - Brașov/Covasna specific news

  - id: mybrasov
    name: "My Brașov"
    url: "https://www.mybrasov.ro"
    type: "rss"
    rss_url: "https://www.mybrasov.ro/rss"
    category: "local"
    enabled: true
    selectors:
      title: "h1.entry-title, h1.post-title"
      content: "div.entry-content, div.post-content, article div.content"
      date: "span.published, time, span.entry-date"
      image: "img.featured-image, img.wp-post-image, article img:first-of-type"
    description: "My Brașov - Noutăți din Brașov"
    retry_attempts: 3
    timeout: 10

  - id: newsbv
