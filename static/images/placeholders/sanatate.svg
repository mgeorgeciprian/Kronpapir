<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#1a1a2e"/>

  <!-- Medical cross -->
  <g transform="translate(150, 100)">
    <!-- Vertical bar -->
    <rect x="-8" y="-50" width="16" height="100" fill="#C62828" opacity="0.9"/>
    <!-- Horizontal bar -->
    <rect x="-50" y="-8" width="100" height="16" fill="#C62828" opacity="0.9"/>
    <!-- Circle background -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#C62828" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Heart icon -->
  <g transform="translate(380, 110)">
    <!-- Left lobe -->
    <path d="M 0,10 C -25,-15 -40,-5 -40,15 C -40,35 -15,55 0,65" fill="white" opacity="0.8"/>
    <!-- Right lobe -->
    <path d="M 0,10 C 25,-15 40,-5 40,15 C 40,35 15,55 0,65" fill="white" opacity="0.8"/>
    <!-- Outline -->
    <path d="M 0,10 C -25,-15 -40,-5 -40,15 C -40,35 -15,55 0,65 C 15,55 40,35 40,15 C 40,-5 25,-15 0,10" fill="none" stroke="#C62828" stroke-width="2.5"/>
  </g>

  <!-- Pill/medication -->
  <g transform="translate(280, 240)">
    <!-- Left circle -->
    <circle cx="-20" cy="0" r="15" fill="white" opacity="0.7"/>
    <!-- Right circle -->
    <circle cx="20" cy="0" r="15" fill="white" opacity="0.7"/>
    <!-- Connecting rect -->
    <rect x="-20" y="-15" width="40" height="30" fill="white" opacity="0.7"/>
  </g>

  <!-- Plus signs scattered -->
  <g transform="translate(500, 200)" opacity="0.5">
    <line x1="-8" y1="0" x2="8" y2="0" stroke="#C62828" stroke-width="2"/>
    <line x1="0" y1="-8" x2="0" y2="8" stroke="#C62828" stroke-width="2"/>
  </g>

  <g transform="translate(100, 280)" opacity="0.4">
    <line x1="-6" y1="0" x2="6" y2="0" stroke="#C62828" stroke-width="1.5"/>
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#C62828" stroke-width="1.5"/>
  </g>

  <!-- Category label -->
  <text x="300" y="370" font-family="Arial, sans-serif" font-size="16" font-weight="300" fill="white" opacity="0.7" text-anchor="middle">Sănătate</text>
</svg>