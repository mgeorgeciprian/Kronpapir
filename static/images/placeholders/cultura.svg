<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#1a1a2e"/>

  <!-- Theater mask - Comedy -->
  <g transform="translate(130, 80)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="white" stroke-width="3"/>
    <!-- Eyes -->
    <circle cx="-20" cy="-15" r="6" fill="white"/>
    <circle cx="20" cy="-15" r="6" fill="white"/>
    <!-- Smile -->
    <path d="M -25,5 Q 0,20 25,5" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Theater mask - Tragedy -->
  <g transform="translate(320, 80)">
    <circle cx="0" cy="0" r="50" fill="none" stroke="white" stroke-width="3"/>
    <!-- Eyes -->
    <circle cx="-20" cy="-15" r="6" fill="white"/>
    <circle cx="20" cy="-15" r="6" fill="white"/>
    <!-- Frown -->
    <path d="M -25,5 Q 0,-15 25,5" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Book -->
  <g transform="translate(210, 200)">
    <!-- Book spine -->
    <rect x="-40" y="-60" width="80" height="120" fill="none" stroke="white" stroke-width="2"/>
    <!-- Pages -->
    <line x1="-35" y1="-55" x2="-35" y2="55" stroke="white" stroke-width="1" opacity="0.6"/>
    <line x1="-30" y1="-55" x2="-30" y2="55" stroke="white" stroke-width="1" opacity="0.6"/>
    <line x1="-25" y1="-55" x2="-25" y2="55" stroke="white" stroke-width="1" opacity="0.6"/>
    <!-- Text lines -->
    <line x1="-10" y1="-30" x2="30" y2="-30" stroke="#6A1B9A" stroke-width="2" opacity="0.8"/>
    <line x1="-10" y1="-15" x2="30" y2="-15" stroke="#6A1B9A" stroke-width="2" opacity="0.8"/>
    <line x1="-10" y1="0" x2="30" y2="0" stroke="#6A1B9A" stroke-width="2" opacity="0.8"/>
    <line x1="-10" y1="15" x2="30" y2="15" stroke="#6A1B9A" stroke-width="2" opacity="0.8"/>
  </g>

  <!-- Accent elements -->
  <circle cx="80" cy="320" r="6" fill="#6A1B9A" opacity="0.5"/>
  <circle cx="520" cy="100" r="5" fill="#6A1B9A" opacity="0.4"/>
  <circle cx="550" cy="300" r="4" fill="#6A1B9A" opacity="0.5"/>

  <!-- Category label -->
  <text x="300" y="370" font-family="Arial, sans-serif" font-size="16" font-weight="300" fill="white" opacity="0.7" text-anchor="middle">Cultură</text>
</svg>