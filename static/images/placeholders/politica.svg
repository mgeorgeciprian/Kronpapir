<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#1a1a2e"/>

  <!-- Accent stripe -->
  <rect width="600" height="60" fill="#8B0000" opacity="0.15"/>

  <!-- Parliament building -->
  <g transform="translate(150, 80)">
    <!-- Main dome -->
    <circle cx="150" cy="80" r="75" fill="none" stroke="white" stroke-width="3"/>
    <path d="M 100,80 Q 150,30 200,80" fill="white" opacity="0.3"/>

    <!-- Columns -->
    <g>
      <rect x="65" y="160" width="12" height="60" fill="white"/>
      <rect x="105" y="160" width="12" height="60" fill="white"/>
      <rect x="145" y="160" width="12" height="60" fill="white"/>
      <rect x="185" y="160" width="12" height="60" fill="white"/>
      <rect x="225" y="160" width="12" height="60" fill="white"/>
    </g>

    <!-- Building base -->
    <rect x="50" y="220" width="200" height="50" fill="white"/>

    <!-- Steps -->
    <rect x="70" y="265" width="160" height="8" fill="white"/>
    <rect x="80" y="275" width="140" height="8" fill="white"/>
    <rect x="90" y="285" width="120" height="8" fill="white"/>

    <!-- Accent detail -->
    <rect x="140" y="230" width="20" height="35" fill="#8B0000"/>
  </g>

  <!-- Decorative elements -->
  <circle cx="100" cy="50" r="4" fill="#8B0000" opacity="0.6"/>
  <circle cx="500" cy="80" r="5" fill="#8B0000" opacity="0.5"/>
  <circle cx="520" cy="320" r="3" fill="#8B0000" opacity="0.6"/>

  <!-- Category label -->
  <text x="300" y="370" font-family="Arial, sans-serif" font-size="16" font-weight="300" fill="white" opacity="0.7" text-anchor="middle">Politică</text>
</svg>