<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#1a1a2e"/>

  <!-- Gold accent elements -->
  <circle cx="80" cy="60" r="3" fill="#C9A84C" opacity="0.4"/>
  <circle cx="520" cy="80" r="4" fill="#C9A84C" opacity="0.5"/>
  <circle cx="540" cy="320" r="3" fill="#C9A84C" opacity="0.3"/>

  <!-- KP Logo -->
  <g transform="translate(150, 80)">
    <!-- K letter -->
    <line x1="0" y1="0" x2="0" y2="80" stroke="#C9A84C" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="35" x2="50" y2="0" stroke="#C9A84C" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="0" y1="35" x2="50" y2="80" stroke="#C9A84C" stroke-width="4.5" stroke-linecap="round"/>

    <!-- P letter -->
    <line x1="80" y1="0" x2="80" y2="80" stroke="#C9A84C" stroke-width="5" stroke-linecap="round"/>
    <path d="M 80,0 Q 130,0 130,30 Q 130,50 105,50 L 80,50" fill="none" stroke="#C9A84C" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Newspaper icon -->
  <g transform="translate(320, 100)">
    <!-- Outer frame -->
    <rect x="0" y="0" width="120" height="140" fill="none" stroke="white" stroke-width="2.5" rx="4"/>

    <!-- Header bar -->
    <rect x="5" y="5" width="110" height="20" fill="white" opacity="0.3"/>

    <!-- Title line -->
    <line x1="10" y1="32" x2="105" y2="32" stroke="white" stroke-width="2" opacity="0.8"/>

    <!-- Content lines -->
    <line x1="10" y1="45" x2="105" y2="45" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="10" y1="55" x2="90" y2="55" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="10" y1="65" x2="105" y2="65" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="10" y1="75" x2="85" y2="75" stroke="white" stroke-width="1.5" opacity="0.6"/>

    <!-- Image placeholder -->
    <rect x="10" y="85" width="105" height="45" fill="white" opacity="0.15"/>
    <circle cx="45" cy="105" r="8" fill="white" opacity="0.2"/>
    <polygon points="50,130 55,120 60,130" fill="white" opacity="0.2"/>
  </g>

  <!-- Accent lines -->
  <line x1="200" y1="280" x2="300" y2="285" stroke="#C9A84C" stroke-width="1" opacity="0.25"/>
  <line x1="320" y1="290" x2="420" y2="295" stroke="#C9A84C" stroke-width="1" opacity="0.25"/>

  <!-- Category label -->
  <text x="300" y="370" font-family="Arial, sans-serif" font-size="16" font-weight="300" fill="white" opacity="0.7" text-anchor="middle">Kronapapir</text>
</svg>