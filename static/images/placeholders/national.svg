<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="600" height="400" fill="#1a1a2e"/>

  <!-- Decorative top stripe -->
  <rect width="600" height="40" fill="#C9A84C" opacity="0.15"/>

  <!-- Romania map outline (simplified) -->
  <g transform="translate(150, 60)">
    <!-- Main body of Romania -->
    <path d="M 80,20 L 120,15 L 140,35 L 150,50 L 140,75 L 120,90 L 100,95 L 70,85 L 50,70 L 45,50 L 55,30 Z"
          fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Transylvania region (heart of Romania) -->
    <circle cx="95" cy="55" r="20" fill="#C9A84C" opacity="0.7"/>

    <!-- Carpathian Mountains indication (curves inside) -->
    <path d="M 70,40 Q 95,35 120,50" fill="none" stroke="#C9A84C" stroke-width="1.5" opacity="0.5"/>
    <path d="M 65,55 Q 95,60 130,70" fill="none" stroke="#C9A84C" stroke-width="1.5" opacity="0.5"/>

    <!-- Capital marker (Bucharest) -->
    <circle cx="130" cy="85" r="4" fill="#C9A84C"/>
  </g>

  <!-- Gold accents -->
  <circle cx="100" cy="280" r="6" fill="#C9A84C" opacity="0.5"/>
  <circle cx="500" cy="120" r="5" fill="#C9A84C" opacity="0.4"/>
  <circle cx="520" cy="320" r="4" fill="#C9A84C" opacity="0.6"/>

  <!-- Decorative lines -->
  <line x1="80" y1="250" x2="180" y2="260" stroke="#C9A84C" stroke-width="1.5" opacity="0.3"/>
  <line x1="420" y1="150" x2="520" y2="160" stroke="#C9A84C" stroke-width="1.5" opacity="0.3"/>

  <!-- Flag colors at bottom -->
  <rect x="200" y="300" width="50" height="10" fill="#002B7F"/>
  <rect x="250" y="300" width="50" height="10" fill="#FCD116"/>
  <rect x="300" y="300" width="50" height="10" fill="#CE1126"/>

  <!-- Category label -->
  <text x="300" y="370" font-family="Arial, sans-serif" font-size="16" font-weight="300" fill="white" opacity="0.7" text-anchor="middle">Național</text>
</svg>