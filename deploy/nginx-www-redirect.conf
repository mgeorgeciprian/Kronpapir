# Redirect 301 www.kronpapir.ro -> kronpapir.ro (acum www răspunde cu 200 și dublează site-ul).
# Se adaugă în configurația nginx a site-ului, ca bloc server separat, înaintea celui principal.
# Căile certificatelor trebuie copiate din blocul existent (certbot).
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.kronpapir.ro;

    # ssl_certificate     /etc/letsencrypt/live/kronpapir.ro/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/kronpapir.ro/privkey.pem;

    return 301 https://kronpapir.ro$request_uri;
}
