# Kronpapir.ro News Sources Configuration
# Local news sources for Brașov/Covasna region
# Supports both RSS feeds and direct web scraping

sources:
  # =============================================
  # LOCAL SOURCES - Brașov/Covasna (RSS)
  # =============================================

  - id: monitorulexpres
    name: "Monitorul Expres"
    url: "https://www.monitorulexpres.ro"
    type: "rss"
    rss_url: "https://www.monitorulexpres.ro/feed/"
    category: "local"
    enabled: true
    selectors:
      title: "h1.entry-title, h1.post-title, h1"
      content: "div.entry-content, div.post-content"
      date: "time, span.entry-date, span.published"
      image: "img.wp-post-image, img.featured-image, article img:first-of-type"
    description: "Monitorul Expres - Ziar din Brașov (din 1998)"
    retry_attempts: 3
    timeout: 15

  - id: bizbrasov
    name: "BizBrașov"
    url: "https://bizbrasov.ro"
    type: "rss"
    rss_url: "https://bizbrasov.ro/feed/"
    category: "local"
    enabled: true
    selectors:
      title: "h1.entry-title, h1.post-title, h1"
      content: "div.entry-content, div.post-content"
      date: "time, span.entry-date, span.published"
      image: "img.wp-post-image, img.featured-image, article img:first-of-type"
    description: "BizBrașov - Știri de business din Brașov"
    retry_attempts: 3
    timeout: 15

  - id: brasovstiri
    name: "Brașov Știri"
    url: "https://brasovstiri.ro"
    type: "rss"
    rss_url: "https://brasovstiri.ro/feed/"
    category: "local"
    enabled: true
    selectors:
      title: "h1.entry-title, h1.post-title, h1"
      content: "div.entry-content, div.post-content"
      date: "time, span.entry-date, span.published"
      image: "img.wp-post-image, img.featured-image, article img:first-of-type"
    description: "Brașov Știri - Ultimele noutăți locale"
    retry_attempts: 3
    timeout: 15

  - id: litera9
    name: "Litera9"
    url: "https://litera9.com"
    type: "rss"
    rss_url: "https://litera9.com/feed/"
    category: "local"
    enabled: true
    selectors:
      title: "h1.entry-title, h1.post-title, h1"
      content: "div.entry-content, div.post-content"
      date: "time, span.entry-date, span.published"
      image: "img.wp-post-image, img.featured-image, article img:first-of-type"
    description: "Litera9 - Jurnalism independent din Brașov"
    retry_attempts: 3
    timeout: 15

  - id: saceleanul
    name: "Săceleanul"
    url: "https://www.saceleanul.ro"
    type: "rss"
    rss_url: "https://www.saceleanul.ro/feed/"
    category: "local"
    enabled: true
    selectors:
      title: "h1.entry-title, h1.post-title, h1"
      content: "div.entry-content, div.post-content"
      date: "time, span.entry-date, span.published"
      image: "img.wp-post-image, img.featured-image, article img:first-of-type"
    description: "Săceleanul - Știri din Săcele și împrejurimi"
    retry_attempts: 3
    timeout: 15

  # =============================================
  # LOCAL SOURCES - Brașov/Covasna (Web Scraping)
  # Pentru site-uri fără RSS funcțional
  # =============================================

  # Actualizat 2026-11-26: homepage-ul nu mai are titluri în h2.entry-title (0 linkuri); are flux RSS.
  - id: newsbv
    name: "News BV"
    url: "https://newsbv.ro"
    type: "rss"
    rss_url: "https://newsbv.ro/feed/"
    category: "local"
    enabled: true
    selectors:
      title: "h1.story-title, h1"
      content: "div.entry-content"
      date: "time"
      image: "meta[property='og:image']"
    description: "News BV - Portal de știri Brașov"
    retry_attempts: 3
    timeout: 15
  # Actualizat 2026-11-26: site propriu (fără RSS); articolele sunt la /stire/<titlu>-a<id>,
  # data în „Publicat la <span>26 noiembrie 2026</span>”.
  - id: bzb
    name: "Bună Ziua Brașov"
    url: "https://bzb.ro"
    type: "scrape"
    category: "local"
    enabled: true
    article_url_pattern: "/stire/[^/]+-a\\d+$"
    selectors:
      article_links: "a[href*='stire/']"
      title: "h1.heading, h1"
      content: "div.txt_articol"
      date: "p.a_date span"
      image: "meta[property='og:image']"
    homepage: "https://bzb.ro"
    max_pages: 1
    max_articles_per_source: 20
    description: "Bună Ziua Brașov - Noutăți zilei (scraping)"
    retry_attempts: 3
    timeout: 15

  # Dezactivat 2026-11-26: domeniul stiridecovasna.ro nu mai are înregistrare DNS (site închis).
  - id: stiridecovasna
    name: "Știri de Covasna"
    url: "https://stiridecovasna.ro"
    type: "scrape"
    category: "local"
    enabled: false
    selectors:
      title: "h1.entry-title, h1.post-title, h1.title, h1"
      content: "div.entry-content, div.post-content, div.article-content, article .content"
      date: "time, span.entry-date, span.post-date, span.date, .published"
      image: "img.wp-post-image, img.featured-image, .post-thumbnail img, article img:first-of-type"
      article_link: "h2.entry-title a, h2.post-title a, h3.entry-title a, .post-title a, article h2 a, .entry-title a"
    homepage: "https://stiridecovasna.ro"
    pagination: "/page/{page}/"
    max_pages: 3
    max_articles_per_source: 30
    description: "Știri de Covasna - Noutăți locale (scraping)"
    retry_attempts: 3
    timeout: 15

  # Actualizat 2026-11-26: fără RSS; titlurile din listă sunt a.link-titlu, data pe articol e relativă („Acum 1 zi, 8 ore”).
  - id: covasnamedia
    name: "Covasna Media"
    url: "https://covasnamedia.ro"
    type: "scrape"
    category: "local"
    enabled: true
    selectors:
      article_links: "a.link-titlu"
      title: "div.detaliu-articol h1"
      content: "div.detaliu-articol > div > p"
      date: "span.data-articol"
      image: "meta[property='og:image']"
    homepage: "https://covasnamedia.ro"
    max_pages: 1
    max_articles_per_source: 20
    description: "Covasna Media - Portal de știri (scraping)"
    retry_attempts: 3
    timeout: 15

  # =============================================
  # INSTITUTIONAL SOURCES - Consilii Județene
  # =============================================

  # Dezactivat 2026-11-26: cjbrasov.ro are o protecție anti-bot (verificare JavaScript în browser,
  # răspuns 503 pentru clienți automați). Nu o ocolim. De reactivat dacă CJ oferă RSS/API sau ne permite accesul.
  - id: cjbrasov
    name: "Consiliul Județean Brașov"
    url: "https://cjbrasov.ro/"
    type: "scrape"
    category: "local"
    enabled: false
    selectors:
      article_links: "a[href*='comunicat'], a[href*='anunt'], .entry-title a, article a, .post-title a"
      title: "h1, .entry-title, .page-title"
      content: ".entry-content, .page-content, article .content, .post-content"
      date: ".entry-date, .post-date, time"
    description: "Consiliul Județean Brașov - Anunțuri și comunicate oficiale"
    retry_attempts: 3
    timeout: 15

  # Actualizat 2026-11-26: url era chiar pagina de listă, iar linkurile (/ro/<titlu>.html) nu începeau cu ea, deci 0 articole.
  - id: cjcv
    name: "Consiliul Județean Covasna"
    url: "https://www.cjcv.ro"
    homepage: "https://www.cjcv.ro/ro/stiri.html"
    type: "scrape"
    category: "local"
    enabled: true
    max_pages: 1
    max_articles_per_source: 15
    article_url_pattern: "/ro/[^/]+\\.html$"
    selectors:
      article_links: "h2.pb-title a"
      title: "div.contentleft h1, h1"
      content: "div.contentleft div.row > div.col-xs-12 p"
      date: "meta[property='article:published_time']"
      image: "meta[property='og:image']"
    description: "Consiliul Județean Covasna - Știri și anunțuri"
    retry_attempts: 3
    timeout: 15

  # =============================================
  # INSTITUTIONAL SOURCES - Primării Brașov
  # =============================================

  # Actualizat 2026-11-26: lista e pe /noutati/, articolele la /detalii-articol/<categorie>/<titlu>/<id>.
  # Fluxul RSS (/stiri-wp/feed/) e blocat (403). Paginile de articol răspund cu 404 deși au conținut.
  - id: primaria_brasov
    name: "Primăria Brașov"
    url: "https://www.brasovcity.ro"
    homepage: "https://www.brasovcity.ro/noutati/"
    type: "scrape"
    category: "local"
    enabled: true
    max_pages: 1
    max_articles_per_source: 20
    article_url_pattern: "/detalii-articol/"
    accept_error_status: [404]
    selectors:
      article_links: "a[href*='/detalii-articol/']"
      title: "h1"
      content: "div.continut-anunt"
      date: "span.anunt-data"
      image: "meta[property='og:image']"
    description: "Primăria Brașov - Anunțuri și noutăți oficiale"
    retry_attempts: 3
    timeout: 15

  # Actualizat 2026-11-26: WordPress cu flux RSS; articolele sunt la /<titlu>/, nu sub /category/anunturi/ (de aceea 0).
  - id: primaria_sacele
    name: "Primăria Săcele"
    url: "https://www.municipiulsacele.ro"
    type: "rss"
    rss_url: "https://www.municipiulsacele.ro/feed/"
    category: "local"
    enabled: true
    selectors:
      title: "h1, .entry-title"
      content: "section.post_content"
      date: ".date"
      image: "meta[property='og:image']"
    description: "Primăria Săcele - Anunțuri și informații publice"
    retry_attempts: 3
    timeout: 15
  # Dezactivat 2026-11-26: homepage-ul dădea 109 pagini statice de meniu (nu știri). Anunțurile reale
  # (/index.php/primaria/anunturi, ~2 pe lună) au doar titlul și un PDF, fără text: ar ieși articole goale.
  # De reactivat cu extragere din PDF (ca sources/brasovcity.py).
  - id: primaria_fagaras
    name: "Primăria Făgăraș"
    url: "https://www.primaria-fagaras.ro"
    homepage: "https://www.primaria-fagaras.ro/index.php/primaria/anunturi"
    type: "scrape"
    category: "local"
    enabled: false
    article_url_pattern: "/comunicat/\\d+$"
    selectors:
      article_links: "div.stire a[href*='/comunicat/']"
      title: "section.content-section h1, section.content-section h2"
      content: "section.content-section"
      date: "section.content-section [class*=data]"
    description: "Primăria Făgăraș - Noutăți și comunicate"
    retry_attempts: 3
    timeout: 15
  # Actualizat 2026-11-26: fără RSS. Pagina articolului nu are dată: o luăm din listă („17/11/2026 Titlu”).
  - id: primaria_rasnov
    name: "Primăria Râșnov"
    url: "https://www.primariarasnov.ro"
    homepage: "https://www.primariarasnov.ro/stiri"
    type: "scrape"
    category: "local"
    enabled: true
    max_pages: 1
    max_articles_per_source: 15
    article_url_pattern: "/stiri/[^/]+$"
    selectors:
      article_links: "div.posts-image-wrapper a[href*='/stiri/']"
      listing_item: "div.posts-image-wrapper div.col-12"
      title: "div.page-header-title h1, h1"
      content: "div.page-content-wrapper div.col-md-12"
      date: "span.post-date"
      image: "meta[property='og:image']"
    description: "Primăria Râșnov - Anunțuri și informații"
    retry_attempts: 3
    timeout: 15
  # Actualizat 2026-11-26: WordPress cu flux RSS pe categoria Știri; selectorii vechi nu găseau nimic.
  - id: primaria_zarnesti
    name: "Primăria Zărnești"
    url: "https://www.primaria-zarnesti.ro"
    type: "rss"
    rss_url: "https://www.primaria-zarnesti.ro/categorie/stiri/feed/"
    category: "local"
    enabled: true
    selectors:
      title: "div.content-box-page-title, h1"
      content: "div.content-box-page"
      image: "meta[property='og:image']"
    description: "Primăria Zărnești - Știri și comunicate"
    retry_attempts: 3
    timeout: 15
  # Actualizat 2026-11-26: WordPress/Elementor cu flux RSS (mai ales HCL-uri, cu textul integral în pagină).
  - id: primaria_predeal
    name: "Primăria Predeal"
    url: "https://www.primaria-predeal.ro"
    type: "rss"
    rss_url: "https://www.primaria-predeal.ro/feed/"
    category: "local"
    enabled: true
    selectors:
      title: "h1.page-title, h1"
      content: "div.elementor-widget-text-editor div.elementor-widget-container"
      date: "time"
      image: "meta[property='og:image']"
    description: "Primăria Predeal - Anunțuri și hotărâri ale Consiliului Local"
    retry_attempts: 3
    timeout: 15

  # =============================================
  # INSTITUTIONAL SOURCES - Primării Covasna
  # =============================================

  # Actualizat 2026-11-26: site propriu fără RSS; știrile sunt la /stiri/<titlu>, data în span.news-date.
  - id: primaria_sgheorghe
    name: "Primăria Sfântu Gheorghe"
    url: "https://www.sfantugheorgheinfo.ro"
    homepage: "https://www.sfantugheorgheinfo.ro/stiri"
    type: "scrape"
    category: "local"
    enabled: true
    max_pages: 1
    max_articles_per_source: 15
    article_url_pattern: "/stiri/[^/?#]+$"
    selectors:
      article_links: "div.news-title a, div.news-image a"
      title: "h1.title, h1"
      content: "div.page-content"
      date: "span.news-date"
      image: "meta[property='og:image']"
    description: "Primăria Sfântu Gheorghe - Știri și anunțuri"
    retry_attempts: 3
    timeout: 15
  # Dezactivat 2026-11-26: TYPO3; anunțurile sunt doar linkuri spre PDF-uri pe o singură pagină, fără pagini de articol.
  # De reactivat cu extragere din PDF.
  - id: primaria_covasna
    name: "Primăria Covasna"
    url: "https://www.primariacovasna.ro/informatii-publice/anunturi/"
    type: "scrape"
    category: "local"
    enabled: false
    selectors:
      article_links: ".entry-title a, article a, .post-title a, h2 a, h3 a"
      title: "h1, .entry-title, .page-title, .post-title"
      content: ".entry-content, .page-content, article .content, .post-content, .article-body"
      date: ".entry-date, .post-date, time, .date"
    description: "Primăria Covasna - Informații și anunțuri publice"
    retry_attempts: 3
    timeout: 15

  # Dezactivat 2026-11-26: același tip de protecție anti-bot ca cjbrasov.ro (503 + verificare JavaScript). Nu o ocolim.
  - id: primaria_intorsura
    name: "Primăria Întorsura Buzăului"
    url: "http://www.intorsura.info/primaria-orasului/starea-civila/anunturi/"
    type: "scrape"
    category: "local"
    enabled: false
    selectors:
      article_links: ".entry-title a, article a, .post-title a, h2 a, h3 a"
      title: "h1, .entry-title, .page-title, .post-title"
      content: ".entry-content, .page-content, article .content, .post-content, .article-body"
      date: ".entry-date, .post-date, time, .date"
    description: "Primăria Întorsura Buzăului - Anunțuri publice"
    retry_attempts: 3
    timeout: 15

  # =============================================
  # NATIONAL SOURCES (RSS)
  # =============================================

  # Dezactivat 2026-11-26: condițiile de utilizare Agerpres permit preluarea a cel mult 500 de caractere,
  # cu „potrivit AGERPRES” în primul paragraf; reproducerea și modificarea conținutului sunt interzise.
  # Rescrierile noastre au ~5.000 de caractere. Pentru preluare comercială: marketing@agerpres.ro.
  # În plus, /home.rss redirecționează spre un extractor extern (api.allorigins.win), care nu mai răspunde.
  - id: agerpres
    name: "Agerpres"
    url: "https://www.agerpres.ro"
    type: "rss"
    rss_url: "https://www.agerpres.ro/home.rss"
    category: "national"
    enabled: false
    selectors:
      title: "h1.title, h1.article-title, h1"
      content: "div.article-body, div.article-content, div.content"
      date: "span.date, time"
      image: "img.featured-image, img.article-image, article img"
    description: "Agerpres - Agenția națională de presă"
    retry_attempts: 2
    timeout: 15

  - id: hotnews
    name: "HotNews"
    url: "https://www.hotnews.ro"
    type: "rss"
    rss_url: "https://www.hotnews.ro/rss"
    category: "national"
    enabled: true
    selectors:
      title: "h1.article-title, h1.post-title, h1"
      content: "div.article-content, article.post, div.content"
      date: "time, span.publish-date"
      image: "img.article-image, img.featured, article img"
    description: "HotNews - Prima publicație 24/7 din România"
    retry_attempts: 2
    timeout: 15

  - id: mediafax
    name: "Mediafax"
    url: "https://www.mediafax.ro"
    type: "rss"
    rss_url: "https://www.mediafax.ro/rss"
    category: "national"
    enabled: true
    selectors:
      title: "h1.article-title, h1.title, h1"
      content: "div.article-content, div.content-area"
      date: "span.publish-date, time"
      image: "img.featured-image, img.article-image"
    description: "Mediafax - Agenție de presă"
    retry_attempts: 2
    timeout: 15

  - id: g4media
    name: "G4Media"
    url: "https://www.g4media.ro"
    type: "rss"
    rss_url: "https://www.g4media.ro/feed"
    category: "national"
    enabled: true
    selectors:
      title: "h1.post-title, h1.entry-title, h1"
      content: "div.post-content, div.entry-content"
      date: "span.post-date, time"
      image: "img.wp-post-image, img.featured-image"
    description: "G4Media - Analiză și comentarii"
    retry_attempts: 2
    timeout: 15

  # Corectat 2026-11-26: „div.article-content” e clasa cardurilor de articole recomandate (inclusiv widgetul
  # Digi Sport), nu a textului; ~27% din articole primeau corpul altei știri. Textul e în div.entry.data-app-meta-article.
  - id: digi24
    name: "Digi24"
    url: "https://www.digi24.ro"
    type: "rss"
    rss_url: "https://www.digi24.ro/rss"
    category: "national"
    enabled: true
    selectors:
      title: "h1.title, h1.article-title, h1"
      content: "div.entry.data-app-meta-article"
      date: "span.publish-date, time"
      image: "img.featured-image, img.article-image"
    description: "Digi24 - Știri naționale"
    retry_attempts: 2
    timeout: 15
  - id: stiripesurse
    name: "Știri Pe Surse"
    url: "https://www.stiripesurse.ro"
    type: "rss"
    rss_url: "https://www.stiripesurse.ro/rss/stiri.xml"  # mutat; /rss dă 404 (verificat 2026-11-26)
    category: "national"
    enabled: true
    selectors:
      title: "h1.post-title, h1.article-title, h1"
      content: "div.post-content, article.post"
      date: "span.post-date, time"
      image: "img.featured-image, img.post-image"
    description: "Știri Pe Surse - Breaking news"
    retry_attempts: 2
    timeout: 15

# Global scraper settings
scraper_config:
  default_timeout: 15
  max_retries: 3
  rate_limit_delay: 2  # seconds between requests to same domain

  deduplication:
    enabled: true
    strategy: "url_hash"  # url_hash or content_hash

  article_retention_days: 30
  batch_size: 10

scheduling:
  local_sources_interval: 3600  # seconds (1 hour)
  national_sources_interval: 7200  # seconds (2 hours)
  cleanup_interval: 86400  # seconds (1 day)
  max_articles_per_source: 100
